# Self-contained backend: each pod bootstraps the site (a lock on the shared
# sites volume serializes replicas), then runs gunicorn + worker + scheduler
# behind the image's nginx on :8080 (which also serves the ERPNext desk UI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdb-backend
  namespace: gdb-dev
spec:
  replicas: 2 # requires the gdb-sites PVC to be RWX — see k8s/README.md
  selector:
    matchLabels: { app: gdb-backend }
  template:
    metadata:
      labels: { app: gdb-backend }
    spec:
      containers:
        - name: gdb-backend
          image: ravinadh/ksquarenis:gdb-backend-latest
          env:
            - name: SITE_NAME
              value: gdb.localhost
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: '3306'
            - name: REDIS_CACHE
              value: redis:6379/0
            - name: REDIS_QUEUE
              value: redis:6379/1
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: gdb-secrets, key: DB_ROOT_PASSWORD }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gdb-secrets, key: ADMIN_PASSWORD }
            - name: WITH_WORKER
              value: '1'
            - name: WITH_SCHEDULER
              value: '1'
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/method/ping
              port: 8080
            # first boot creates the site — give it time
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 40
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: gdb-sites }
---
apiVersion: v1
kind: Service
metadata:
  name: gdb-backend
  namespace: gdb-dev
spec:
  selector: { app: gdb-backend }
  ports:
    - port: 8080
