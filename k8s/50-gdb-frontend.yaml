apiVersion: apps/v1
kind: Deployment
metadata:
  name: gdb-frontend
  namespace: gdb-dev
spec:
  replicas: 2
  selector:
    matchLabels: { app: gdb-frontend }
  template:
    metadata:
      labels: { app: gdb-frontend }
    spec:
      containers:
        - name: gdb-frontend
          image: ravinadh/ksquarenis:gdb-latest
          env:
            - name: BACKEND_URL
              value: http://gdb-backend:8080
            - name: FRAPPE_SITE_NAME
              value: gdb.localhost
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gdb-frontend
  namespace: gdb-dev
spec:
  selector: { app: gdb-frontend }
  ports:
    - port: 80
  # Expose via your ingress controller / LoadBalancer as appropriate.
