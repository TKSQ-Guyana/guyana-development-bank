# One-shot site bootstrap. Idempotent — re-running migrates instead of
# recreating. Delete and re-apply the Job to run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: gdb-create-site
  namespace: gdb-dev
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-site
          image: ravinadh/ksquarenis:gdb-backend-latest
          command: ['create-site']
          env:
            - name: SITE_NAME
              value: gdb.localhost
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: '3306'
            - name: REDIS_CACHE
              value: redis-cache:6379
            - name: REDIS_QUEUE
              value: redis-queue:6379
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: gdb-secrets, key: DB_ROOT_PASSWORD }
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gdb-secrets, key: ADMIN_PASSWORD }
          volumeMounts:
            - name: sites
              mountPath: /home/frappe/frappe-bench/sites
      volumes:
        - name: sites
          persistentVolumeClaim: { claimName: gdb-sites }
