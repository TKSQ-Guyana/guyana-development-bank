services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: guyana-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    # H2 dev database lives in the container layer: `docker compose restart` keeps
    # your test data, `docker compose down` discards it and re-imports the JSON fresh.
