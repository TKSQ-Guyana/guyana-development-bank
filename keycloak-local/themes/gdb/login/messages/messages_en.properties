# What the sign-in page calls things.
#
# BOTH KEYS ARE OVERRIDDEN ON PURPOSE. Keycloak picks the label by realm
# setting: `usernameOrEmail` when "Login with email" is on, `username` when it
# is off. Setting only one leaves the page reading "Username" the day somebody
# flips that switch in the admin console, and nobody would connect the two.
username=e-ID Number
usernameOrEmail=e-ID Number

# The error Keycloak returns for a wrong password AND for an e-ID it has never
# heard of. That ambiguity is deliberate on Keycloak's part and we keep it:
# distinguishing them would tell an attacker which e-IDs exist. The wording just
# has to name the thing the citizen actually typed.
invalidUserMessageOrEmail=Incorrect e-ID or password.
invalidUserMessage=Incorrect e-ID or password.

doLogIn=Sign in
loginTitle=Sign in to Guyana Development Bank
loginTitleHtml=Guyana Development Bank

# Shown under the control by the theme's script.
gdbEidHint=The 11-digit number on your national e-ID card.
