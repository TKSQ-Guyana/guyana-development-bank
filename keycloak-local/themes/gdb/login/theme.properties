# The GDB login theme — the page a citizen actually signs in on.
#
# Under Authorization Code + PKCE the credential page belongs to Keycloak, not
# to our SPA. Stock Keycloak asks for a "Username", which is not a thing a
# Guyanese citizen has; this theme turns that field into the three-box e-ID
# control the card and the portal both use, and puts GDB's name on the page.
#
# NO TEMPLATE OVERRIDE, DELIBERATELY. There is no login.ftl here. Everything is
# done by adding a stylesheet, a script and a message bundle on top of
# keycloak.v2. Overriding the FreeMarker template would mean re-stating
# PatternFly markup we do not own and re-checking it on every Keycloak upgrade,
# to change one field. The cost of this choice is that with JavaScript disabled
# the citizen gets the stock single field — which still works, and still signs
# them in, which is the right way for this to degrade.
#
# A DIRECTORY THEME NEEDS NO BUILD. docker-compose mounts this folder at
# /opt/keycloak/themes/gdb and `start-dev` disables theme caching, so editing a
# file here and reloading the page is the whole loop. The `build` command in
# Keycloak's docs applies to provider JARs, not to this.
#
# The realm is pointed at this theme by keycloak-local/setup-gdb.mjs, from
# GDB_LOGIN_THEME in the generated structure module.

parent=keycloak.v2
import=common/keycloak

# keycloak.v2 declares `styles=css/styles.css`, and setting this key REPLACES
# the inherited value rather than adding to it — so its own stylesheet has to
# be named again here or the page loses all of PatternFly's form styling.
# (`stylesCommon` is a separate key and is left alone.) Ours loads last so it
# wins on the handful of things it changes.
styles=css/styles.css css/gdb.css

# keycloak.v2 sets no `scripts`, so nothing is displaced by this.
scripts=js/eid-boxes.js
