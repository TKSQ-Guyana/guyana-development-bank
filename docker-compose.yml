# The whole stack in SIX services:
#   mariadb, redis, backend (self-contained ERPNext), frontend (React portal),
#   keycloak (all sign-in), face (the sign-up face check).
#
#   docker compose up -d --build
#
# The backend container does everything ERPNext: bootstraps/migrates the site
# on start (first boot takes several minutes — watch `docker compose logs -f
# backend`), then runs gunicorn + background worker + scheduler behind the
# image's own nginx on :8080 (which also serves the ERPNext desk UI).
# One Redis serves cache (DB /0) and queue (DB /1).
#
# Portal: http://localhost:3000    ERPNext desk: http://localhost:8080
# Keycloak: http://localhost:8086  (admin/admin — realms gdb-citizen, gdb-staff)
#
# KEYCLOAK AUTHENTICATES EVERYBODY — two realms, two doors (keycloak/README.md):
#   citizens  e-ID + password        -> realm gdb-citizen
#   staff     work email + password  -> realm gdb-staff
#   NO ACCOUNTS ARE SEEDED, in either realm or in the portal. The stack comes
#   up with the Administrator alone — see README, "First administrator".
#   Frappe's own email login remains ONLY for System Users — the Administrator
#   break-glass (password = ADMIN_PASSWORD, default "admin") and the ERPNext
#   desk until it gets Keycloak SSO. It refuses citizens.
#
# OUTSIDE APIS (DCRA, the bank switch) are off until configured, and an API
# that is off answers "Unavailable" — nothing stands in for it. Configure one
# in the portal (Administration -> Integrations), or in .env:
#   DCRA_BASE_URL, DCRA_API_KEY, BANK_REGISTRY_BASE_URL, BANK_REGISTRY_API_KEY
services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    image: gdb-backend:local
    environment:
      SITE_NAME: ${SITE_NAME:-gdb.localhost}
      DB_HOST: mariadb
      DB_PORT: '3306'
      REDIS_CACHE: redis:6379/0
      REDIS_QUEUE: redis:6379/1
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WITH_WORKER: '1'
      WITH_SCHEDULER: '1'
      WITH_SOCKETIO: '0'
      # e-ID sign-in (gdb_bank.identity). In-network hostname: the browser
      # never talks to Keycloak — the backend runs the password grant itself,
      # so this needs no public URL and no CORS entry. Unset any one of the
      # three and the e-ID form says "not configured" instead of failing oddly.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gdb-citizen}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-gdb-citizen-portal}
      # Public client in the seeded realm, so no secret. A confidential client
      # sets this and nothing else changes.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # --- the STAFF realm ------------------------------------------------
      #
      # GDB staff sign in with their WORK EMAIL and a password Keycloak holds
      # (identity.staff_login). The realm NEVER provisions: a Keycloak account
      # alone opens nothing — the Frappe account and its roles must have been
      # created by the platform administrator.
      #
      # Locally this is the gdb-staff realm in the keycloak service below. A
      # deployment can point it at the government directory instead, provided
      # that realm accepts the email as the username.
      KEYCLOAK_STAFF_URL: ${KEYCLOAK_STAFF_URL:-http://keycloak:8080}
      KEYCLOAK_STAFF_REALM: ${KEYCLOAK_STAFF_REALM:-gdb-staff}
      KEYCLOAK_STAFF_CLIENT_ID: ${KEYCLOAK_STAFF_CLIENT_ID:-gdb-staff-portal}
      KEYCLOAK_STAFF_CLIENT_SECRET: ${KEYCLOAK_STAFF_CLIENT_SECRET:-}
      # The confidential client the portal uses to create and disable staff
      # accounts in that realm, and to set their one-time and chosen
      # passwords (integrations/keycloak_admin.py). Its
      # service account holds realm-management manage-users there and nothing
      # anywhere else. DEV SECRET — a deployment sets its own, or stores it in
      # the portal's Integration settings, where it is encrypted.
      # The ONE seeded account — the first Platform Admin (bootstrap_admin.py).
      # Values live in .env, never here. The password is its FIRST one and is
      # set temporary: the first sign-in makes the person choose their own.
      GDB_PLATFORM_ADMIN_EMAIL: ${GDB_PLATFORM_ADMIN_EMAIL:-}
      GDB_PLATFORM_ADMIN_NAME: ${GDB_PLATFORM_ADMIN_NAME:-GDB Platform Administrator}
      GDB_PLATFORM_ADMIN_PASSWORD: ${GDB_PLATFORM_ADMIN_PASSWORD:-}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-gdb-portal-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-gdb-portal-admin-dev-secret}
      # The citizen realm's admin client: creates the Keycloak account behind a
      # TIN sign-up (tin_auth.py). Holds manage-users in gdb-citizen only.
      # DEV SECRET, as above.
      KEYCLOAK_CITIZEN_ADMIN_CLIENT_ID: ${KEYCLOAK_CITIZEN_ADMIN_CLIENT_ID:-gdb-citizen-admin}
      KEYCLOAK_CITIZEN_ADMIN_CLIENT_SECRET: ${KEYCLOAK_CITIZEN_ADMIN_CLIENT_SECRET:-gdb-citizen-admin-dev-secret}
      # Sign-up / sign-in codes by SMS (integrations/sms_otp.py, Twilio Verify).
      # All three set in .env: codes are texted. Any missing: the fixed code
      # below is used instead and shown on screen — NOT FOR PRODUCTION.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      # The "we received your request / application" texts
      # (integrations/sms.py): a Messaging Service, or a sending number.
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Texts go out through Infobip; SMS_PROVIDER=twilio switches back.
      SMS_PROVIDER: ${SMS_PROVIDER:-infobip}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_SENDER: ${INFOBIP_SENDER:-}
      # The portal's public https address: Twilio reports each text's
      # delivery back to it (integrations/sms.status_callback).
      GDB_PUBLIC_URL: ${GDB_PUBLIC_URL:-}
      GDB_STATIC_OTP: ${GDB_STATIC_OTP:-123456}
      # --- outside APIs ---------------------------------------------------
      #
      # Empty by default, which means OFF: every DCRA and bank-account check
      # answers "Unavailable" until its base URL is set. There is no stand-in
      # data. A value saved in the portal's Integration settings overrides
      # these (integrations/settings.py); the API keys are secrets and are
      # better kept there, where they are encrypted.
      DCRA_BASE_URL: ${DCRA_BASE_URL:-}
      DCRA_API_KEY: ${DCRA_API_KEY:-}
      BANK_REGISTRY_BASE_URL: ${BANK_REGISTRY_BASE_URL:-}
      BANK_REGISTRY_API_KEY: ${BANK_REGISTRY_API_KEY:-}
      # Sign-up's face check (gdb_bank.face_check) — the face service below, by
      # its in-network name, and the secret it insists on. No token: the face
      # check is off and sign-up goes straight to the code, as before.
      # Outgoing email (gdb_bank.integrations.mail). Off until GDB_SMTP_USER and
      # GDB_SMTP_PASSWORD (an app password) are set in .env.
      GDB_SMTP_SERVER: ${GDB_SMTP_SERVER:-smtp.gmail.com}
      GDB_SMTP_PORT: ${GDB_SMTP_PORT:-587}
      GDB_SMTP_USER: ${GDB_SMTP_USER:-}
      GDB_SMTP_PASSWORD: ${GDB_SMTP_PASSWORD:-}
      GDB_MAIL_SENDER: ${GDB_MAIL_SENDER:-Guyana Development Bank}
      GDB_PORTAL_URL: ${GDB_PORTAL_URL:-http://localhost:3000}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face:8000}
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:-}
    # host.docker.internal is automatic on Docker Desktop; this makes the same
    # compose file work on Linux engines too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      # DEV ONLY. gdb_bank is baked into the image at build time, so without
      # this every one-line Python change costs a full image rebuild plus a
      # site bootstrap. Mounting the source over it means a Python change needs
      # only `docker compose restart backend`; only a new DocType or custom
      # field still needs `bench migrate`.
      #
      # The mount shadows the copy in the image, so the host tree becomes the
      # source of truth. Production must NOT carry this line — there the baked
      # image is the artefact being deployed.
      - ./backend/apps/gdb_bank:/home/frappe/frappe-bench/apps/gdb_bank
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      # service_started, not healthy: the backend only calls Keycloak when
      # somebody signs in with an e-ID, so a slow realm import must not hold
      # up the site bootstrap.
      keycloak:
        condition: service_started
    restart: unless-stopped

  # The face check at sign-up: InsightFace on CPU (face/). INTERNAL — no port is
  # published; only the backend calls it, with FACE_SERVICE_TOKEN. Reference
  # photos are the KYC register's enrolment pictures, <profile_id>.jpg, mounted
  # read-only from GDB_KYC_PHOTO_DIR (outside the repo: real people's faces).
  # LICENCE: the buffalo_l models are non-commercial — trial use only.
  face:
    build: ./face
    image: gdb-face:local
    environment:
      FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:-}
      PHOTO_DIR: /photos
    volumes:
      - ${GDB_KYC_PHOTO_DIR:-./face/photos}:/photos:ro
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # start-dev = dev mode (no TLS, H2 store). The realm is imported ONLY if it
    # does not already exist in the volume — see keycloak/README.md for how to
    # force a re-import after editing gdb-realm.json.
    command: ['start-dev', '--import-realm', '--features-disabled=organization']
    environment:
      KC_FEATURES_DISABLED: 'organization'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # The address a BROWSER reaches Keycloak at (its admin console), not the
      # in-network http://keycloak:8080 the backend calls. Backchannel dynamic
      # keeps those in-network calls working; token issuers then name this
      # public URL, which identity.py never checks locally (it confirms every
      # token through userinfo instead).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8086}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    volumes:
      # Each realm file is imported only if that realm does not exist yet, so
      # adding gdb-staff reaches an existing volume on the next start without
      # touching gdb-citizen (keycloak/README.md).
      - ./keycloak/gdb-realm.json:/opt/keycloak/data/import/gdb-realm.json:ro
      - ./keycloak/gdb-staff-realm.json:/opt/keycloak/data/import/gdb-staff-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - '${KEYCLOAK_PORT:-8086}:8080'
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: gdb-frontend:local
    environment:
      BACKEND_URL: http://backend:8080
      FRAPPE_SITE_NAME: ${SITE_NAME:-gdb.localhost}
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  sites:
  mariadb-data:
  keycloak-data:
