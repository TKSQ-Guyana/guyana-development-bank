# The whole stack in FOUR services:
#   mariadb, redis, backend (self-contained ERPNext), frontend (React portal).
#
#   docker compose up -d --build
#
# The backend container does everything ERPNext: bootstraps/migrates the site
# on start (first boot takes several minutes — watch `docker compose logs -f
# backend`), then runs gunicorn + background worker + scheduler behind the
# image's own nginx on :8080 (which also serves the ERPNext desk UI).
# One Redis serves cache (DB /0) and queue (DB /1).
#
# Portal: http://localhost:3000    ERPNext desk: http://localhost:8080
# Demo logins (password = ADMIN_PASSWORD, default "admin"):
#   citizen@example.gy (citizen) · underwriter@gdb.gov.gy (underwriter)
#   Administrator (ERPNext admin)
services:
  mariadb:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8085}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
    ports:
      - '${KEYCLOAK_PORT:-8085}:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-local/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # The GDB login theme. Under PKCE the citizen types their e-ID on
      # Keycloak's page, not ours, so this is where the three-box control and
      # the GDB branding live. A directory theme needs no JAR and no `build`
      # step — Keycloak reads it straight from here. `start-dev` also disables
      # theme caching, so editing a file and reloading is enough.
      - ./keycloak-local/themes/gdb:/opt/keycloak/themes/gdb:ro
    restart: unless-stopped

  kc-bootstrap:
    image: node:22-alpine
    working_dir: /tmp
    environment:
      KC: http://keycloak:8080
      REALM: Guyana-Gov
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: admin
      GDB_DEMO_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak-local:/seed:ro
      - ./backend/scripts:/backend/scripts:ro
    command:
      - sh
      - -c
      - |
        i=0
        until node /seed/setup-mps.mjs; do
          i=$$((i+1))
          if [ "$$i" -ge 60 ]; then
            echo '[kc-bootstrap] keycloak never became seedable' >&2
            exit 1
          fi
          echo "[kc-bootstrap] keycloak not ready yet (attempt $$i) — retrying in 5s"
          sleep 5
        done
        # GDB personas: realm roles, the gdb-portal PKCE client and the e-ID
        # claim mapper. Generated from rbac/personas.py, so a new persona
        # reaches Keycloak on the next `docker compose up`.
        node /seed/setup-gdb.mjs
    depends_on:
      - keycloak
    restart: 'no'

  backend:
    build: ./backend
    image: gdb-backend:local
    environment:
      SITE_NAME: ${SITE_NAME:-gdb.localhost}
      DB_HOST: mariadb
      DB_PORT: '3306'
      REDIS_CACHE: redis:6379/0
      REDIS_QUEUE: redis:6379/1
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # TWO URLS FOR ONE KEYCLOAK, and they are not interchangeable.
      #   KEYCLOAK_URL        how THIS CONTAINER reaches it, over the docker
      #                       network. Used to fetch JWKS and to validate `iss`.
      #   KEYCLOAK_PUBLIC_URL how the BROWSER reaches it. Used to build the
      #                       sign-in redirect. Sending the browser to
      #                       `http://keycloak:8080` yields a host it cannot
      #                       resolve — a sign-in button that goes nowhere,
      #                       with nothing in any log to say why.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8085}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Guyana-Gov}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-gdb-portal}
      WITH_WORKER: '1'
      WITH_SCHEDULER: '1'
      WITH_SOCKETIO: '0'
      # Lets `after_migrate` seed the demo citizen's applications. LOCAL ONLY —
      # these are fabricated credit records (one is an approved 2M facility),
      # and in a real database they are a fake loan book that reaches the Board
      # portfolio report and Finance reconciliation with nothing marking them
      # synthetic. A production deployment leaves this unset; see
      # `install.demo_data_enabled`.
      GDB_SEED_DEMO_DATA: '1'
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      # DEV LOOP. `gdb_bank` is baked into the image, so without this every
      # one-line Python change costs a full image rebuild AND a full
      # `bench migrate` — minutes, repeated, for a typo. Mounting the package
      # over the installed copy makes a change a restart instead.
      #
      # ONLY THE PACKAGE DIRECTORY, not the app root: `pyproject.toml` and the
      # `.egg-info` that pip wrote at build time live one level up, and
      # shadowing those would un-install the app from the bench's virtualenv.
      #
      # Remove this line for a production-shaped build, where the image should
      # be the only source of code.
      - ./backend/apps/gdb_bank/gdb_bank:/home/frappe/frappe-bench/apps/gdb_bank/gdb_bank
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: gdb-frontend:local
    environment:
      BACKEND_URL: http://backend:8080
      FRAPPE_SITE_NAME: ${SITE_NAME:-gdb.localhost}
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  sites:
  mariadb-data:
  keycloak-data:
