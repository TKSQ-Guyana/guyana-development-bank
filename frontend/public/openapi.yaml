openapi: 3.0.3
info:
  title: GDB Citizen Loan Portal API
  version: 0.1.0
  description: |
    REST surface of the `gdb_bank` Frappe app (ERPNext backend). Applications
    are stored in the official frappe/lending app's Loan Application doctype;
    these endpoints expose a stable portal contract over it.

    Every custom endpoint is a Frappe *whitelisted method* invoked as
    `POST /api/method/gdb_bank.<module>.<name>` with a JSON body.
    Authentication is the standard Frappe **session cookie** (`sid`), minted
    after **Keycloak** authenticates the caller through one of two doors:
    citizens with their e-ID (`gdb_bank.identity.password_login`), GDB staff
    with their work email (`gdb_bank.identity.staff_login`). Frappe's own
    `POST /api/method/login` remains for System Users only (break-glass).
    Results are wrapped as `{"message": <result>}`; errors carry `exc_type` /
    `_server_messages`.

    Served through the gdb-frontend nginx, `/api` is same-origin with the SPA.
servers:
  - url: /
    description: Same origin as the page calling this spec (Swagger UI at /api-docs.html) — keeps the sid cookie
  - url: http://localhost:3000
    description: Local compose stack (through the frontend nginx proxy)
  - url: http://localhost:8080
    description: Backend direct (the backend's own nginx)

tags:
  - name: auth
  - name: citizen
  - name: underwriter
    description: |
      The officer who DECIDES: review, offer, conditions, document review.
      Neither booking nor release — see the finance tag.
  - name: finance
    description: |
      The officer who MOVES MONEY: booking, disbursement, the payment file,
      collections. Booking sits here rather than with the underwriter because
      creating the Loan is what puts the facility on GDB's books.
      A separate role from the underwriter, and `disburse_loan` additionally
      refuses whoever approved the case, so one person holding both roles
      still cannot decide and pay the same application.
  - name: documents
  - name: platform_admin
    description: |
      Runs the platform: staff and citizen accounts, roles, the kill switch,
      the access history, system health and integration settings. The
      `Platform Admin` role is in none of the credit or money authority sets,
      so every underwriter, finance and disbursement endpoint refuses it.
      Every state change is POST-only, needs a `reason`, and is recorded in
      the append-only access history.

paths:
  /api/method/login:
    post:
      tags: [auth]
      summary: Frappe's own login — System Users only (break-glass)
      description: |
        Kept for the Administrator and the ERPNext desk until the desk has
        Keycloak SSO. Refuses a citizen (Website User) with "Citizens sign in
        with their e-ID." — citizens use `password_login`, staff `staff_login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usr, pwd]
              properties:
                usr: { type: string, example: citizen@example.gy }
                pwd: { type: string, example: admin }
      responses:
        '200':
          description: 'Logged in; `Set-Cookie: sid=…`'
        '401':
          description: Wrong credentials

  /api/method/gdb_bank.identity.password_login:
    post:
      tags: [auth]
      summary: Log in with a national e-ID (guest-allowed; sets the sid cookie)
      description: |
        Runs the **Keycloak password grant** with the e-ID as the username,
        confirms the token against Keycloak's `userinfo`, maps the identity
        onto a Frappe User and mints the ordinary `sid` session — so every
        other endpoint behaves identically whichever way the caller signed in.

        The e-ID **is** the Keycloak username, shape `123-4567-8901` (3-4-4,
        eleven digits). Input is normalised first, so bare digits or spaced
        variants are accepted.

        First sign-in either **links** the e-ID to an existing User with the
        same email, or **provisions** a new Website User with the `Citizen`
        role. Roles are never taken from Keycloak. This door **never opens a
        staff account**: an e-ID whose email belongs to one is refused before
        anything is linked ("This e-ID belongs to a GDB staff account").

        Rate-limited to 8 attempts per e-ID per minute — this path does not go
        through Frappe's own `track_login_attempts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eid, password]
              properties:
                eid: { type: string, pattern: '^\d{3}-\d{4}-\d{4}$', example: '592-1111-0001' }
                password: { type: string, format: password, example: ChangeMe@123 }
      responses:
        '200':
          description: 'Logged in; `Set-Cookie: sid=…`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    allOf:
                      - $ref: '#/components/schemas/Whoami'
                      - type: object
                        properties:
                          provisioned:
                            type: boolean
                            description: True when this sign-in created the User.
        '401':
          description: |
            Incorrect e-ID or password — deliberately the same answer for an
            unknown e-ID as for a wrong password, so the endpoint does not
            reveal which e-IDs exist. Also returned for a disabled account.
        '417':
          description: |
            Malformed e-ID, e-ID sign-in not configured on this site, the
            Keycloak client has direct access grants disabled, or the account
            has no email address on file.
        '429':
          description: Rate limit exceeded (8 attempts per e-ID per minute)

  /api/method/gdb_bank.identity.eid_login_available:
    post:
      tags: [auth]
      summary: Which Keycloak sign-in doors this site has configured (guest-allowed)
      description: |
        `available` is the citizen e-ID door: false when any of
        `keycloak_url` / `keycloak_realm` / `keycloak_client_id` is unset
        (portal Integration settings, site_config, or the matching
        `KEYCLOAK_*` environment variable). `staff_available` is the same
        question for the staff realm.
      responses:
        '200':
          description: Availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      available: { type: boolean }
                      citizen_realm: { type: string, nullable: true }
                      staff_available: { type: boolean }
                      staff_realm: { type: string, nullable: true }

  /api/method/logout:
    post:
      tags: [auth]
      summary: Log out (invalidates the session)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Logged out }

  /api/method/gdb_bank.identity.staff_login:
    post:
      tags: [auth]
      summary: GDB staff sign-in with a work email (guest-allowed; sets the sid cookie)
      description: |
        Runs the Keycloak password grant against the **staff realm** with the
        work email as the username, confirms the token against `userinfo`
        (whose `email` must equal the one typed), and mints the ordinary `sid`
        session.

        **Never provisions.** The Frappe account — and its roles — must already
        have been created by the platform administrator; a Keycloak account
        alone opens nothing. Refuses a citizen account.

        A **one-time password** (issued by the platform administrator) is
        right but opens no session: the answer is
        `{"message": {"password_change_required": true}}`, and the client
        continues with `staff_set_password`. Keycloak only says so once the
        password is correct, so this reveals nothing a wrong guess would not.

        Rate-limited to 8 attempts per email per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: underwriter@gdb.gov.gy }
                password: { type: string, format: password, example: ChangeMe@123 }
      responses:
        '200':
          description: |
            Logged in (`Set-Cookie: sid=…`, message is Whoami), or — for a
            one-time password — `{password_change_required: true}` and no
            session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    oneOf:
                      - $ref: '#/components/schemas/Whoami'
                      - type: object
                        properties:
                          password_change_required: { type: boolean, enum: [true] }
        '401':
          description: |
            Incorrect email or password (same answer for an unknown email), no
            GDB account for this email, not a staff account, or disabled.
        '417': { description: Staff sign-in not configured on this site }
        '429': { description: Rate limit exceeded (8 attempts per email per minute) }

  /api/method/gdb_bank.identity.staff_set_password:
    post:
      tags: [auth]
      summary: First staff sign-in — replace the one-time password with your own, then sign in (guest-allowed)
      description: |
        `password` is the one-time password the platform administrator was
        shown. It is checked with Keycloak before anything changes, and the
        account must be one the portal would open and must be waiting on a
        new password — this is not a general change-password endpoint. The
        new password is saved as permanent in Keycloak (clearing its pending
        action), the access history records `Password Chosen` as the
        person's own act, and the `sid` session is minted exactly as
        `staff_login` would. Neither password is stored or logged by GDB.

        The new password: at least 12 characters, at most 128, not the
        one-time password, not the email. Keycloak's realm policy, if any,
        applies on top. Rate-limited to 8 attempts per email per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, new_password]
              properties:
                email: { type: string, format: email, example: k.ramdass@gdb.gov.gy }
                password: { type: string, format: password, description: The one-time password, example: Kx7m-P2qa-9TfR }
                new_password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '200':
          description: 'Password set and logged in; `Set-Cookie: sid=…`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Whoami' }
        '401': { description: Incorrect email or one-time password, no GDB account, not a staff account, or disabled }
        '417': { description: 'New password refused by the rules above or by Keycloak, the password is already set, or not configured' }
        '429': { description: Rate limit exceeded (8 attempts per email per minute) }

  /api/method/gdb_bank.api.whoami:
    post:
      tags: [auth]
      summary: Current session user, roles, and underwriter flag
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Session identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Whoami' }
        '401': { description: Not logged in }

  /api/method/gdb_bank.api.save_application:
    post:
      tags: [citizen]
      summary: Create or update the applicant's DRAFT application
      description: |
        A draft is not before the Bank: `all_loans` excludes it and only
        `submit_application` moves it across. It exists so evidence can be
        attached to something before the application is made, and so a dropped
        session loses nothing. Pass `name` to update an existing draft.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loan_amount, purpose, term_months]
              properties:
                loan_amount: { type: number, example: 450000 }
                purpose: { type: string, example: Expand the poultry pens }
                term_months: { type: integer, minimum: 1, maximum: 360, example: 18 }
                monthly_income: { type: number, example: 90000 }
                phone: { type: string, example: '+592-600-1234' }
                business_stage: { type: string, enum: [Existing, New] }
                dcra_number: { type: string, nullable: true }
                business_name: { type: string, nullable: true }
                name:
                  type: string
                  nullable: true
                  description: An existing draft to update. Omit to create one.
      responses:
        '200':
          description: The draft, status `Draft`
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanApplication' }
        '403': { description: Not your draft }

  /api/method/gdb_bank.api.submit_application:
    post:
      tags: [citizen]
      summary: Put a draft before the Bank (documents are optional)
      description: |
        Never refused for missing evidence. Documents are optional at
        submission: the types the Bank EXPECTS (Identity always, plus
        Financials for an existing business or a Business Plan for a new one)
        are advisory only, surfaced as the `missing` array of
        `gdb_bank.documents.list_documents` and recorded on the submit log
        line. An underwriter chases what is outstanding with
        `gdb_bank.documents.request_information`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: ACC-LOAP-2026-00028 }
      responses:
        '200':
          description: The submitted application, status `Submitted`
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanApplication' }
        '417': { description: Not a draft — already submitted }

  /api/method/gdb_bank.api.discard_application:
    post:
      tags: [citizen]
      summary: Abandon a draft (drafts only — a submitted application is the Bank's record)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200': { description: "{ discarded: <name> }" }
        '403': { description: Not your draft }

  /api/method/gdb_bank.documents.new_document:
    post:
      tags: [documents]
      summary: Open a shelf row — step 1 of 3 in adding evidence
      description: |
        Evidence is added in three calls, and the middle one is the framework's:

          1. `new_document` — the row, so the file has something to attach to
          2. `POST /api/method/upload_file` (multipart: `file`,
             `doctype=GDB Applicant Document`, `docname=<row name>`,
             `is_private=1`) — Frappe's own endpoint
          3. `confirm_document` — the row is stamped with what arrived

        Step 2 is what makes the private file readable by exactly the people
        who may read the row: `File.has_permission` delegates to the attached
        document. PDF only, 10 MB, enforced in a `File.before_insert` hook.

        Omit `application` for a personal document (Identity, Proof of
        Address); those follow the person across applications.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_type]
              properties:
                document_type:
                  type: string
                  enum: [Identity, Proof of Address, Financials, Business Plan, Bank Statement, Quotation, Other]
                application: { type: string, nullable: true }
                request:
                  type: string
                  nullable: true
                  description: The information request this answers; it closes when the file lands.
      responses:
        '200':
          description: The shelf row, with no file yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/ApplicantDocument' }
        '403': { description: Not your application — staff cannot upload on an applicant's behalf }

  /api/method/upload_file:
    post:
      tags: [documents]
      summary: Frappe's OWN upload endpoint — step 2 of 3, multipart
      description: |
        Not a gdb_bank endpoint. It is used directly because
        `File.has_permission` delegates a private file's access to the document
        it is attached to: attaching to the shelf row is what makes the PDF
        readable by the applicant and by GDB staff and by nobody else, decided
        by the framework rather than by a second implementation here.

        Send `multipart/form-data` and let the client set the boundary — naming
        `Content-Type` by hand breaks the upload. POST only (Frappe v16).

        The file lands as `/private/files/<name>`, which Frappe serves only
        after checking permissions, and which nginx and vite both proxy.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, doctype, docname, is_private]
              properties:
                file: { type: string, format: binary, description: PDF, 10 MB max. }
                doctype: { type: string, enum: [GDB Applicant Document] }
                docname: { type: string, description: The row from new_document. }
                is_private: { type: integer, enum: [1] }
      responses:
        '200':
          description: The File document
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      name: { type: string }
                      file_url: { type: string, example: /private/files/national-id.pdf }
                      file_name: { type: string }
                      file_size: { type: integer }
                      is_private: { type: integer, example: 1 }
        '403': { description: No write permission on the row being attached to }
        '417': { description: Not a PDF, or over the size limit }

  /api/method/gdb_bank.documents.confirm_document:
    post:
      tags: [documents]
      summary: Stamp the shelf row with the uploaded file — step 3 of 3
      description: |
        Also retires the previous document of the same type on the same case
        (`status: Replaced`, `superseded_by` pointing at this one), and closes
        the information request this answers, if any.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: GDB-DOC-2026-00002 }
      responses:
        '200':
          description: The stamped row
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/ApplicantDocument' }
        '417': { description: No file arrived for this row }

  /api/method/gdb_bank.documents.list_documents:
    post:
      tags: [documents]
      summary: The shelf for a case (plus the applicant's personal documents)
      description: |
        Readable by whoever may read the case. Staff may also pass `applicant`
        to read one person's shelf — how a cluster member's own documents reach
        the underwriter deciding the head's application.
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                application: { type: string, nullable: true }
                applicant: { type: string, nullable: true, description: Staff only. }
      responses:
        '200':
          description: Documents, what is still missing, and the upload limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      documents:
                        type: array
                        items: { $ref: '#/components/schemas/ApplicantDocument' }
                      missing:
                        type: array
                        description: Expected document types not yet on file. Advisory — it blocks nothing.
                        items: { type: string }
                      settings:
                        type: object
                        properties:
                          types: { type: array, items: { type: string } }
                          personal_types: { type: array, items: { type: string } }
                          accepts: { type: string, example: .pdf }
                          max_bytes: { type: integer, example: 10485760 }
        '403': { description: Not your application, or not your shelf }

  /api/method/gdb_bank.documents.delete_document:
    post:
      tags: [documents]
      summary: Remove a document from a draft
      description: Refused once the application is submitted — replace it instead.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200': { description: "{ deleted: <name>, missing: [...] }" }
        '403': { description: Not your document }
        '417': { description: Belongs to a submitted application }

  /api/method/gdb_bank.documents.review_document:
    post:
      tags: [underwriter]
      summary: Accept or reject one document, with a reason the applicant sees
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              properties:
                name: { type: string, example: GDB-DOC-2026-00005 }
                status: { type: string, enum: [Accepted, Rejected] }
                note: { type: string, example: Only three months are shown. }
      responses:
        '200':
          description: The reviewed row
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/ApplicantDocument' }
        '403': { description: Underwriters only }

  /api/method/gdb_bank.documents.request_information:
    post:
      tags: [underwriter]
      summary: Ask the applicant for something, itemised
      description: |
        An open item both sides can see and count, rather than a message. The
        applicant answers by uploading against it (`new_document` with
        `request`), and it closes itself.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application, item]
              properties:
                application: { type: string }
                item: { type: string, example: Six months of bank statements }
                document_type: { type: string, nullable: true }
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/InformationRequest' }
        '403': { description: Underwriters only }
        '417': { description: Application not submitted yet }

  /api/method/gdb_bank.documents.withdraw_request:
    post:
      tags: [underwriter]
      summary: Take back an ask (kept as a withdrawn row, never deleted)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200': { description: The withdrawn request }
        '403': { description: Underwriters only }

  /api/method/gdb_bank.documents.list_requests:
    post:
      tags: [documents]
      summary: Everything the Bank has asked for on this case
      description: Applicant-visible by design — an ask nobody can read cannot be answered.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application]
              properties:
                application: { type: string }
      responses:
        '200':
          description: Requests and how many are open
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      requests:
                        type: array
                        items: { $ref: '#/components/schemas/InformationRequest' }
                      open: { type: integer }

  /api/method/gdb_bank.profiles.my_profile:
    post:
      tags: [citizen]
      summary: The applicant's own details — asserted and declared, side by side
      description: |
        Two blocks that are never merged: `verified_*` is what the e-ID
        directory said at sign-in, the rest is what the applicant typed. An
        underwriter reads both, because where they disagree is the case worth
        looking at.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: The profile, created empty on first read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/CitizenProfile' }

  /api/method/gdb_bank.profiles.save_profile:
    post:
      tags: [citizen]
      summary: Fill in the declared half of the profile
      description: The verified half is the directory's and cannot be written here.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                date_of_birth: { type: string, format: date }
                occupation: { type: string }
                region: { type: string, example: Region 4 — Demerara-Mahaica }
                village_or_town: { type: string }
                address: { type: string }
                next_of_kin: { type: string }
                next_of_kin_phone: { type: string }
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/CitizenProfile' }

  /api/method/gdb_bank.profiles.profile_of:
    post:
      tags: [underwriter]
      summary: One person's profile, for staff (read only)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string, example: asha.persaud@example.gy }
      responses:
        '200':
          description: The profile, or null if they have never filled one in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/CitizenProfile' }
        '403': { description: Staff only, or your own }

  /api/method/gdb_bank.api.invite_member:
    post:
      tags: [citizen]
      summary: The cluster head invites an e-ID
      description: |
        The invitee joins by ACCEPTING, signed in as themselves — nobody is
        added to a group they never agreed to. An e-ID with no portal account
        yet is a valid invitee: the row waits against the bare e-ID and links
        on their first e-ID sign-in.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eid]
              properties:
                eid: { type: string, example: 592-3333-0003 }
                full_name: { type: string, nullable: true, description: Shown until they sign in. }
      responses:
        '200': { description: The cluster, with the invitation on the roster }
        '403': { description: Cluster head only }
        '417': { description: Already invited, or already in a cluster }

  /api/method/gdb_bank.api.my_invitations:
    post:
      tags: [citizen]
      summary: Clusters this person has been asked to join and has not answered
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Array of clusters, each with head_name and invited_on }

  /api/method/gdb_bank.api.respond_to_invitation:
    post:
      tags: [citizen]
      summary: Accept or decline an invitation
      description: |
        Accepting is what turns the row from an e-ID into a member: `member` is
        stamped from the session, so a row can never be activated for somebody
        other than the person answering it.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster]
              properties:
                cluster: { type: string }
                accept: { type: integer, enum: [0, 1], default: 1 }
      responses:
        '200': { description: "The cluster on accept; { declined: <cluster> } on decline" }
        '417': { description: No outstanding invitation, or already in a cluster }

  /api/method/gdb_bank.conditions.add_condition:
    post:
      tags: [underwriter]
      summary: Add a case-specific condition precedent after the offer went out
      description: |
        Blocks release exactly like a condition raised from the Letter of Offer
        — `disburse_loan` reads `outstanding`, which does not care where a
        condition came from. Internal to GDB: the checklist is staff-only
        (`list_conditions`), so use an information request to ask the
        applicant for something.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application, description]
              properties:
                application: { type: string }
                description: { type: string, example: Site visit to the pens completed. }
                is_required: { type: integer, enum: [0, 1], default: 1 }
      responses:
        '200': { description: The condition }
        '403': { description: Underwriters only }

  /api/method/gdb_bank.api.apply_loan:
    post:
      tags: [citizen]
      summary: Save and submit in one call
      description: |
        `save_application` followed by `submit_application`. Documents are
        optional at submission, so this one-shot call succeeds with an empty
        shelf; use the two-phase flow when the applicant wants to attach
        evidence before the Bank sees the case.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loan_amount, purpose, term_months]
              properties:
                loan_amount: { type: number, example: 2500000 }
                purpose: { type: string, example: Working capital for agro-processing }
                term_months: { type: integer, minimum: 1, maximum: 360, example: 36 }
                monthly_income: { type: number, example: 450000 }
                phone: { type: string, example: '+592-600-1234' }
      responses:
        '200':
          description: Created application
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanApplication' }

  /api/method/gdb_bank.api.my_loans:
    post:
      tags: [citizen]
      summary: The logged-in citizen's applications (history), newest first
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: array
                    items: { $ref: '#/components/schemas/LoanApplication' }

  /api/method/gdb_bank.api.loan_detail:
    post:
      tags: [citizen]
      summary: One application (owner or underwriter only)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: ACC-LOAP-2026-00001 }
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanApplication' }
        '403': { description: Not the owner and not an underwriter }

  /api/method/gdb_bank.api.all_loans:
    post:
      tags: [underwriter]
      summary: 'Underwriter queue: all applications, optionally by status'
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Submitted, Approved, Rejected]
      responses:
        '200':
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: array
                    items: { $ref: '#/components/schemas/LoanApplication' }
        '403': { description: Caller is not a Loan Underwriter / System Manager }

  /api/method/gdb_bank.api.review_loan:
    post:
      tags: [underwriter]
      summary: Underwriter decision on an application
      description: |
        `approve` / `reject` a Submitted application. Records reviewer,
        timestamp and optional remarks.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, action]
              properties:
                name: { type: string, example: ACC-LOAP-2026-00001 }
                action:
                  type: string
                  enum: [approve, reject]
                remarks: { type: string, example: Income verified; approved. }
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanApplication' }
        '403': { description: Caller is not an underwriter }
        '417': { description: Illegal transition for the current status }

  /api/method/gdb_bank.api.book_loan:
    post:
      tags: [finance]
      summary: Book the Loan for an approved application (disbursement officer)
      description: |
        Creates the lending **Loan** from an Approved application using
        lending's own `create_loan` mapper, and submits it (status
        `Sanctioned`). Booking is a separate act from approval, with its own
        audit line - approving does not book.

        **Disbursement officer only**, not the underwriter: booking is the
        money side's first act, and everything after it is a drawdown.

        Refuses an application that is not Approved, one already booked, and
        one whose Letter of Offer the applicant has not accepted.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application]
              properties:
                application: { type: string, example: ACC-LOAP-2026-00001 }
      responses:
        '200':
          description: The loan account after booking (schedule still empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanAccount' }
        '403': { description: Caller is not the disbursement officer }
        '417': { description: Not Approved, already booked, or no accepted offer }

  /api/method/gdb_bank.api.disburse_loan:
    post:
      tags: [finance]
      summary: Disburse a booked loan (generates the repayment schedule)
      description: |
        Submits a lending **Loan Disbursement** against the booked Loan. This
        is the step that generates the repayment schedule.

        Omit `amount` to disburse everything still undrawn. The figure is
        passed to lending untouched - lending's own `validate_disbursal_amount`
        rules on whether it is allowed, so the limit lives in one place.

        Requires loan status `Sanctioned` or `Partially Disbursed`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application]
              properties:
                application: { type: string, example: ACC-LOAP-2026-00001 }
                amount:
                  type: number
                  example: 650000
                  description: Defaults to the full undrawn balance.
      responses:
        '200':
          description: The loan account after disbursement
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanAccount' }
        '403': { description: Caller is not an underwriter }
        '417': { description: Not booked, or not awaiting disbursement }

  /api/method/gdb_bank.api.loan_account:
    post:
      tags: [citizen]
      summary: Booked loan, repayment schedule and what is left to pay
      description: |
        Returns `loan: null` while the application is still with the
        underwriter or not yet booked. Every figure is lending's own - the
        schedule rows it generated and the dues from its `calculate_amounts`.
        Readable by the owner, a cluster member, or an underwriter.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application]
              properties:
                application: { type: string, example: ACC-LOAP-2026-00001 }
      responses:
        '200':
          description: Loan account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanAccount' }
        '403': { description: Not your application }

  /api/method/gdb_bank.api.make_repayment:
    post:
      tags: [citizen]
      summary: Record a repayment against the booked loan
      description: |
        Submits a lending **Loan Repayment**. Any member of a cluster may pay
        the group's facility; the ledger records who paid (`gdb_paid_by`), not
        only whose facility it is.

        Requires loan status `Disbursed`, `Partially Disbursed` or `Active`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [application, amount]
              properties:
                application: { type: string, example: ACC-LOAP-2026-00001 }
                amount: { type: number, example: 38442 }
      responses:
        '200':
          description: The loan account after the payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/LoanAccount' }
        '403': { description: Not your application }
        '417': { description: Not booked, or not open for repayment }

  # -- Platform administration ------------------------------------------------
  # Every endpoint below answers 403 "Only the GDB platform administrator may
  # do this." to any other role.

  /api/method/gdb_bank.platform_admin.list_users:
    post:
      tags: [platform_admin]
      summary: Staff or citizen accounts, one page at a time
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [staff, citizens], default: staff }
                search: { type: string, description: 'Name, email or e-ID' }
                start: { type: integer, default: 0 }
                page_length: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: '`{users: AccountSummary[], has_more, grantable_roles}`'

  /api/method/gdb_bank.platform_admin.get_user:
    post:
      tags: [platform_admin]
      summary: One account, with what the administrator may change about it
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [user], properties: { user: { type: string } } }
      responses:
        '200': { description: 'AccountDetail — roles, status, e-ID, can_change_roles, warnings…' }
        '404': { description: No such account }

  /api/method/gdb_bank.platform_admin.create_staff_user:
    post:
      tags: [platform_admin]
      summary: Create a staff account (and its Keycloak account, with a one-time password shown once)
      description: |
        Creates a System User holding only the given portal roles, with NO
        Frappe password. When the Keycloak admin client is configured, also
        creates the staff-realm account and sets a **temporary** one-time
        password on it, returned as `one_time_password` in this response and
        nowhere else (not stored, not logged, not in the access history).
        It works for one sign-in, where the person must choose their own
        (`staff_set_password`).
        `keycloak.status` is `issued`, `linked` (an account already existed —
        no one-time password; use `reset_password`), `manual` (not configured
        — create it in Keycloak by hand) or `failed`.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, roles, reason]
              properties:
                full_name: { type: string, example: Kevin Ramdass }
                email: { type: string, format: email, example: k.ramdass@gdb.gov.gy }
                eid:
                  type: string
                  example: 592-4321-0099
                  description: The person's national e-ID — for the conflict-of-interest check, never to sign in.
                roles:
                  type: array
                  items: { type: string, enum: [Loan Underwriter, Disbursement Officer, Finance Officer] }
                reason: { type: string, example: 'New hire, credit team' }
      responses:
        '200': { description: '`{user: AccountDetail, keycloak: {status, detail}, one_time_password: string | null}`' }
        '403': { description: A role outside the grantable three }
        '409': { description: Email or e-ID already on an account }

  /api/method/gdb_bank.platform_admin.set_user_roles:
    post:
      tags: [platform_admin]
      summary: Set a staff account's portal roles (the desired end state — repeating it is a no-op)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, roles, reason]
              properties:
                user: { type: string }
                roles: { type: array, items: { type: string } }
                reason: { type: string }
      responses:
        '200': { description: '`{user, changed}`' }
        '403': { description: "Own account, an administrator's account, a citizen account, or an ungrantable role" }

  /api/method/gdb_bank.platform_admin.set_user_enabled:
    post:
      tags: [platform_admin]
      summary: The kill switch — disable or re-enable an account
      description: |
        Disabling ends the account's open sessions immediately and is honoured
        at every sign-in even while Keycloak still accepts the password. For a
        staff account the Keycloak account is disabled too when the admin
        client is configured.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, enabled, reason]
              properties:
                user: { type: string }
                enabled: { type: integer, enum: [0, 1] }
                reason: { type: string, example: Resigned 30 Sep 2026 }
      responses:
        '200': { description: '`{user, changed, keycloak}`' }
        '403': { description: Own account or an administrator's account }

  /api/method/gdb_bank.platform_admin.reset_password:
    post:
      tags: [platform_admin]
      summary: Issue a staff member a new one-time password (shown once) and end their open sessions
      description: |
        Replaces whatever the account signs in with by a temporary one-time
        password, returned as `one_time_password` in this response only. The
        person's open portal sessions are ended. At their next sign-in they
        must choose their own (`staff_set_password`), so the administrator
        never knows the password they use. Staff accounts, enabled, only.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, reason]
              properties:
                user: { type: string }
                reason: { type: string, example: Forgot their password }
      responses:
        '200': { description: '`{user, one_time_password, detail}`' }
        '403': { description: Own account or an administrator's account }
        '417': { description: A citizen account, a disabled account, or Keycloak account management not configured }

  /api/method/gdb_bank.platform_admin.access_history:
    post:
      tags: [platform_admin]
      summary: The append-only access history — who changed what, from what, to what, when and why
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user: { type: string, description: Only changes to this account }
                start: { type: integer, default: 0 }
                page_length: { type: integer, default: 50, maximum: 100 }
      responses:
        '200': { description: '`{rows: AccessChange[], has_more}`' }

  /api/method/gdb_bank.platform_admin.system_health:
    post:
      tags: [platform_admin]
      summary: Scheduler, job queues, recent errors, backups and integration status
      description: Counts, times and titles only — never a traceback or a file path.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: SystemHealth }

  /api/method/gdb_bank.platform_admin.integration_settings:
    post:
      tags: [platform_admin]
      summary: Every integration setting in force and where it comes from
      description: A secret is never returned — only whether it is set and its source.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: 'IntegrationGroup[]' }

  /api/method/gdb_bank.platform_admin.save_integration_settings:
    post:
      tags: [platform_admin]
      summary: Override one integration's settings (recorded, with a reason)
      description: |
        `values` maps a setting to its new override. For an ordinary setting
        `""` removes the override. For a secret an absent key leaves it alone,
        `""` removes it and any other value replaces it.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group, values, reason]
              properties:
                group: { type: string, enum: [citizen_eid, staff_sign_in, staff_accounts, dcra, bank_registry] }
                values: { type: object, additionalProperties: { type: string } }
                reason: { type: string }
      responses:
        '200': { description: 'IntegrationGroup[] after the change' }
        '417': { description: A malformed URL or identifier }

  /api/method/gdb_bank.platform_admin.test_integration:
    post:
      tags: [platform_admin]
      summary: Check one integration, optionally with unsaved values overlaid
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group: { type: string }
                values: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: '`{ok: true|false|null, latency_ms, detail}`' }

components:
  schemas_note: |
    ApplicantDocument, InformationRequest and CitizenProfile below are the
    evidence surfaces. Files themselves are private and served by Frappe from
    /private/files/..., which checks permissions on every request.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Frappe session cookie from /api/method/login
  schemas:
    ApplicantDocument:
      type: object
      properties:
        name: { type: string, example: GDB-DOC-2026-00002 }
        applicant: { type: string, example: citizen@example.gy }
        applicant_name: { type: string, nullable: true }
        application:
          type: string
          nullable: true
          description: Null for a personal document held against the person.
        document_type: { type: string, example: Identity }
        status: { type: string, enum: [Received, Accepted, Rejected, Replaced] }
        request: { type: string, nullable: true }
        file_url:
          type: string
          nullable: true
          example: /private/files/national-id.pdf
          description: Private. Frappe serves it only to someone who may read this row.
        file_name: { type: string, nullable: true, example: national-id.pdf }
        file_size: { type: integer, nullable: true, example: 592 }
        uploaded_on: { type: string, nullable: true }
        reviewed_by: { type: string, nullable: true }
        reviewed_on: { type: string, nullable: true }
        review_note: { type: string, nullable: true }
        superseded_by: { type: string, nullable: true }
        creation: { type: string }
    InformationRequest:
      type: object
      properties:
        name: { type: string, example: GDB-REQ-2026-00001 }
        application: { type: string }
        applicant: { type: string }
        status: { type: string, enum: [Open, Satisfied, Withdrawn] }
        document_type: { type: string, nullable: true }
        item: { type: string, example: Six months of bank statements }
        requested_by: { type: string, nullable: true }
        requested_on: { type: string, nullable: true }
        satisfied_by: { type: string, nullable: true, example: GDB-DOC-2026-00005 }
        responded_on: { type: string, nullable: true }
    CitizenProfile:
      type: object
      description: |
        Two blocks, never merged. `verified_*` is asserted by the e-ID
        directory at sign-in; the rest is declared by the applicant.
      properties:
        name: { type: string }
        user: { type: string }
        eid: { type: string, nullable: true }
        full_name: { type: string, nullable: true }
        updated_on: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        date_of_birth: { type: string, nullable: true }
        occupation: { type: string, nullable: true }
        region: { type: string, nullable: true }
        village_or_town: { type: string, nullable: true }
        address: { type: string, nullable: true }
        next_of_kin: { type: string, nullable: true }
        next_of_kin_phone: { type: string, nullable: true }
        verified_full_name: { type: string, nullable: true }
        verified_email: { type: string, nullable: true }
        verified_phone: { type: string, nullable: true }
        verified_birth_date: { type: string, nullable: true }
        verified_address: { type: string, nullable: true }
        identity_source: { type: string, nullable: true, example: e-ID directory }
        verified_on: { type: string, nullable: true }
    LoanAccount:
      type: object
      properties:
        application: { type: string, example: ACC-LOAP-2026-00001 }
        loan:
          nullable: true
          description: Null until the application is booked.
          type: object
          properties:
            name: { type: string, example: ACC-LOAN-2026-00003 }
            status:
              type: string
              example: Disbursed
              description: Sanctioned | Partially Disbursed | Disbursed | Active | Closed
            loan_amount: { type: number, example: 650000 }
            disbursed_amount: { type: number, example: 650000 }
            total_payment: { type: number, example: 690731.15 }
            total_amount_paid: { type: number, example: 38442 }
            total_principal_paid: { type: number, example: 38442 }
            monthly_repayment_amount: { type: number, example: 38442 }
            rate_of_interest: { type: number, example: 0 }
            repayment_periods: { type: integer, example: 18 }
        schedule:
          type: array
          description: Generated by lending on disbursement; empty before it.
          items:
            type: object
            properties:
              payment_date: { type: string, format: date }
              principal_amount: { type: number }
              interest_amount: { type: number }
              total_payment: { type: number }
              balance_loan_amount: { type: number }
        disbursable:
          type: number
          nullable: true
          description: |
            What lending reports as still drawable
            (`loan_disbursement.get_disbursal_amount`) - it nets off
            adjustments, refunds and write-offs, honours a Line of Credit
            limit, and is 0 while a secured loan is in security shortfall.
            Returned only to underwriters; null for everyone else. Clients
            must not derive this from loan_amount - disbursed_amount.
        dues:
          type: object
          description: Relayed from lending's calculate_amounts, keys unchanged.
          properties:
            overdue_total_amount: { type: number }
            overdue_principal_amount: { type: number }
            overdue_interest_amount: { type: number }
            overdue_charges: { type: number }
            principal_outstanding: { type: number }
            oldest_due_date: { type: string, format: date, nullable: true }
    Whoami:
      type: object
      properties:
        user: { type: string, example: citizen@example.gy }
        full_name: { type: string, example: Demo Citizen }
        roles:
          type: array
          items: { type: string }
        eid:
          type: string
          nullable: true
          example: 592-1111-0001
          description: The e-ID this login is bound to; null for an email/password session.
        is_underwriter: { type: boolean }
        is_finance:
          type: boolean
          description: The books — ledger, portfolio, reconciliation, rule proposals.
        is_disbursement:
          type: boolean
          description: Release authority — booking, disbursement, the payment file.
        is_platform_admin:
          type: boolean
          description: Accounts, roles, health and integration settings — no case, no credit, no money.
    LoanApplication:
      type: object
      properties:
        name: { type: string, example: ACC-LOAP-2026-00001 }
        applicant: { type: string, example: citizen@example.gy }
        applicant_eid:
          type: string
          nullable: true
          example: 592-1111-0001
          description: How GDB staff identify an applicant. Null if they have never used an e-ID.
        applicant_name: { type: string, example: Demo Citizen }
        loan_amount: { type: number, example: 2500000 }
        purpose: { type: string }
        term_months: { type: integer, example: 36 }
        monthly_income: { type: number, example: 450000 }
        phone: { type: string, nullable: true }
        status:
          type: string
          enum: [Draft, Submitted, Approved, Rejected]
          description: |
            `Draft` is the applicant's own workspace (docstatus 0) — saved,
