{{- if .Values.keycloak.enabled -}}
{{- $n := include "gdb.name" . -}}
{{- $k := .Values.keycloak -}}
{{- $s := include "gdb.secretName" . -}}
{{- $sel := dict "root" . "component" "keycloak" -}}
{{- $realms := .Files.Glob "files/keycloak/*.json" -}}
{{- if and $k.realmImport.enabled (eq (len $realms) 0) -}}
{{- fail "keycloak.realmImport.enabled=true but files/keycloak/ has no *.json. Copy keycloak/gdb-realm.json and gdb-staff-realm.json into the chart (secrets replaced by ${ENV} placeholders - see README), or set keycloak.realmImport.enabled=false." -}}
{{- end -}}
{{- if $k.realmImport.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-keycloak-realms
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
data:
  {{- ($realms).AsConfig | nindent 2 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-keycloak
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  {{- if not $k.autoscaling.enabled }}
  replicas: {{ $k.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "gdb.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gdb.selectorLabels" $sel | nindent 8 }}
      {{- if $k.realmImport.enabled }}
      annotations:
        checksum/realms: {{ ($realms).AsConfig | sha256sum }}
      {{- end }}
    spec:
      {{- include "gdb.imagePullSecrets" . | nindent 6 }}
      {{- include "gdb.placement" . | nindent 6 }}
      affinity:
        {{- include "gdb.spreadAffinity" $sel | nindent 8 }}
      containers:
        - name: keycloak
          image: {{ include "gdb.image" (dict "img" .Values.images.keycloak "key" "keycloak") }}
          imagePullPolicy: {{ .Values.images.keycloak.pullPolicy }}
          args:
            - start
            {{- if $k.realmImport.enabled }}
            - --import-realm
            {{- end }}
            - --features-disabled=organization
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
            - {name: jgroups, containerPort: 7800}
          env:
            - {name: KC_DB, value: mariadb}
            - name: KC_DB_URL
              value: {{ printf "jdbc:mariadb://%s:3306/%s" (include "gdb.dbHost" .) $k.database.name | quote }}
            - {name: KC_DB_USERNAME, value: {{ $k.database.user | quote }}}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $s }}, key: keycloak-db-password}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ $k.adminUser | quote }}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $s }}, key: keycloak-admin-password}
            {{- if $k.hostname }}
            - {name: KC_HOSTNAME, value: {{ $k.hostname | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            {{- else }}
            # internal-only: the backend reaches it at http://{{ $n }}-keycloak:8080
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            {{- end }}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: KC_METRICS_ENABLED, value: "true"}
            - {name: KC_FEATURES_DISABLED, value: organization}
            # clustering: replicas find each other through the headless service
            - {name: KC_CACHE, value: ispn}
            - {name: KC_CACHE_STACK, value: kubernetes}
            - name: JAVA_OPTS_APPEND
              value: {{ printf "-Djgroups.dns.query=%s-keycloak-headless.%s.svc.cluster.local %s" $n .Release.Namespace $k.javaOptsAppend | quote }}
            # values substituted into ${...} placeholders of the imported realm files
            - name: GDB_PORTAL_ADMIN_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $s }}, key: keycloak-admin-client-secret}
            - name: GDB_CITIZEN_ADMIN_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $s }}, key: keycloak-citizen-admin-client-secret}
          {{- if $k.realmImport.enabled }}
          volumeMounts:
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $k.resources | nindent 12 }}
      {{- if $k.realmImport.enabled }}
      volumes:
        - name: realms
          configMap:
            name: {{ $n }}-keycloak-realms
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-keycloak
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  selector:
    {{- include "gdb.selectorLabels" $sel | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-keycloak-headless
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "gdb.selectorLabels" $sel | nindent 4 }}
  ports:
    - {name: jgroups, port: 7800, targetPort: jgroups}
{{- if gt (int $k.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $n }}-keycloak
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "gdb.selectorLabels" $sel | nindent 6 }}
{{- end }}
{{- end }}
