{{- $s := .Values.secrets -}}
{{- $name := include "gdb.secretName" . -}}
{{- if not (has $s.mode (list "existing" "external" "create")) -}}
{{- fail "secrets.mode must be one of: existing, external, create" -}}
{{- end -}}

{{- if eq $s.mode "external" }}
apiVersion: {{ $s.external.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.external.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.external.storeKind }}
    name: {{ required "secrets.external.storeName is required" $s.external.storeName }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secrets.external.remoteKey is required" $s.external.remoteKey }}
{{- end }}

{{- if eq $s.mode "create" }}
{{- $required := list "db-root-password" "admin-password" "keycloak-admin-password" "keycloak-db-password" "keycloak-admin-client-secret" "keycloak-citizen-admin-client-secret" }}
{{- $weak := list "admin" "password" "changeme" "123456" "gdb-portal-admin-dev-secret" "gdb-citizen-admin-dev-secret" }}
{{- range $k := $required }}
{{- $v := toString (index $s.values $k | default "") }}
{{- if not $v }}{{ fail (printf "secrets.values.%s is required" $k) }}{{ end }}
{{- if has $v $weak }}{{ fail (printf "secrets.values.%s uses a known development value - set a real secret" $k) }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gdb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $v := $s.values }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
