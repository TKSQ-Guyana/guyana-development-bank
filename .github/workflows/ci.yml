name: Build and Push GDB Docker Images

on:
  push:
    branches:
      - main
      - development

  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also roll the gdb-dev deployments to the new images'
        type: boolean
        default: false

env:
  IMAGE_NAME: ravinadh/ksquarenis

jobs:
  # ============================================================
  # CI - Frontend (React citizen portal)
  # ============================================================
  docker-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ravinadh
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:gdb${{ github.run_number }}" \
            -t "$IMAGE_NAME:gdb-latest" \
            .

      - name: Push Docker Images
        run: |
          docker push "$IMAGE_NAME:gdb${{ github.run_number }}"
          docker push "$IMAGE_NAME:gdb-latest"

  # ============================================================
  # CI - Backend (ERPNext + gdb_bank custom app)
  # ============================================================
  docker-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ravinadh
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_NAME:gdb-backend${{ github.run_number }}" \
            -t "$IMAGE_NAME:gdb-backend-latest" \
            .

      - name: Push Docker Images
        run: |
          docker push "$IMAGE_NAME:gdb-backend${{ github.run_number }}"
          docker push "$IMAGE_NAME:gdb-backend-latest"

  # ============================================================
  # CD - Roll gdb-dev deployments (manual: workflow_dispatch with
  # deploy=true; the deployments are managed outside this repo —
  # see k8s/ for reference manifests)
  # ============================================================
  deploy:
    needs:
      - docker-frontend
      - docker-backend

    if: github.event_name == 'workflow_dispatch' && inputs.deploy

    runs-on: [self-hosted, linux, x64]

    env:
      NAMESPACE: gdb-dev

    steps:
      - name: Check Kubernetes Connectivity
        run: kubectl get nodes

      - name: Update GDB Frontend Image
        env:
          DEPLOYMENT: gdb-frontend
          IMAGE: ravinadh/ksquarenis:gdb${{ github.run_number }}
        run: |
          CONTAINER=$(kubectl get deployment "$DEPLOYMENT" \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].name}')
          kubectl set image deployment/"$DEPLOYMENT" \
            "$CONTAINER=$IMAGE" \
            -n "$NAMESPACE"

      - name: Update GDB Backend Image
        env:
          DEPLOYMENT: gdb-backend
          IMAGE: ravinadh/ksquarenis:gdb-backend${{ github.run_number }}
        run: |
          CONTAINER=$(kubectl get deployment "$DEPLOYMENT" \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].name}')
          kubectl set image deployment/"$DEPLOYMENT" \
            "$CONTAINER=$IMAGE" \
            -n "$NAMESPACE"

      - name: Wait for Rollouts
        run: |
          kubectl rollout status deployment/gdb-frontend -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/gdb-backend -n "$NAMESPACE" --timeout=5m

      - name: Verify Deployment
        run: |
          kubectl get deployments,pods -n "$NAMESPACE"
